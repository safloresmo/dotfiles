# Micrófono virtual con supresión de ruido (RNNoise) sobre el Elgato XLR Dock.
# Lo carga filter-chain.service; recargar con:
#   systemctl --user restart filter-chain.service
context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Wave DX sin ruido"
            media.name       = "Wave DX sin ruido"
            filter.graph = {
                nodes = [
                    {
                        type   = ladspa
                        name   = rnnoise
                        plugin = /usr/lib/ladspa/librnnoise_ladspa.so
                        label  = noise_suppressor_mono
                        control = {
                            # por debajo de este % de probabilidad de voz, silencio
                            "VAD Threshold (%)"        = 50.0
                            # ms que sigue abierto tras dejar de hablar
                            "VAD Grace Period (ms)"    = 200
                            "Retroactive VAD Grace (ms)" = 0
                        }
                    }
                    # quita retumbe y golpes por debajo de la voz
                    { type = builtin name = pasa_altos label = bq_highpass
                        control = { "Freq" = 70.0 "Q" = 0.707 } }
                    # cuerpo y profundidad
                    { type = builtin name = graves label = bq_lowshelf
                        control = { "Freq" = 140.0 "Q" = 0.707 "Gain" = 4.5 } }
                    # menos sonido de caja
                    { type = builtin name = medios label = bq_peaking
                        control = { "Freq" = 350.0 "Q" = 1.0 "Gain" = -2.5 } }
                    # claridad para que los graves no opaquen la voz
                    { type = builtin name = presencia label = bq_peaking
                        control = { "Freq" = 4500.0 "Q" = 0.9 "Gain" = 2.0 } }
                    # empareja el volumen: voz más llena y constante
                    { type = ladspa name = compresor plugin = /usr/lib/ladspa/sc4m_1916.so label = sc4m
                        control = {
                            "RMS/peak"             = 0.0
                            "Attack time (ms)"     = 5.0
                            "Release time (ms)"    = 150.0
                            "Threshold level (dB)" = -29.0
                            "Ratio (1:n)"          = 3.0
                            "Knee radius (dB)"     = 6.0
                            "Makeup gain (dB)"     = 14.0
                        } }
                    # techo: nunca satura aunque haya un grito o una risa
                    { type = ladspa name = limitador plugin = /usr/lib/ladspa/fast_lookahead_limiter_1913.so label = fastLookaheadLimiter
                        control = {
                            "Input gain (dB)"  = 0.0
                            "Limit (dB)"       = -1.5
                            "Release time (s)" = 0.1
                        } }
                ]
                links = [
                    { output = "presencia:Out"    input = "compresor:Input" }
                    { output = "compresor:Output" input = "limitador:Input 1" }
                    { output = "rnnoise:Output"  input = "pasa_altos:In" }
                    { output = "pasa_altos:Out"  input = "graves:In" }
                    { output = "graves:Out"      input = "medios:In" }
                    { output = "medios:Out"      input = "presencia:In" }
                ]
                inputs  = [ "rnnoise:Input" ]
                outputs = [ "limitador:Output 1" ]
            }
            audio.rate     = 48000
            audio.position = [ MONO ]
            capture.props = {
                node.name     = "capture.wave_dx_sin_ruido"
                # solo procesa cuando alguna app usa el micrófono
                node.passive  = true
                target.object = "alsa_input.usb-Elgato_Systems_Elgato_XLR_Dock_A8A9A5101260M5-00.mono-fallback"
            }
            playback.props = {
                node.name   = "wave_dx_sin_ruido"
                media.class = Audio/Source
            }
        }
    }
]
