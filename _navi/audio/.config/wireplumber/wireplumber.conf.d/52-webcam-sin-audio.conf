# La C920 se usa solo como cámara: su micrófono no se expone al sistema.
# El vídeo no se ve afectado. Borrar este archivo y reiniciar wireplumber
# para recuperarlo.
monitor.alsa.rules = [
    {
        matches = [
            { device.name = "~alsa_card.usb-046d_HD_Pro_Webcam_C920*" }
        ]
        actions = {
            update-props = {
                device.disabled = true
            }
        }
    }
]
